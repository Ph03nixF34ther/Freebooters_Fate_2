<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Freebooters Fate #2 Tabletop</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>
        <canvas class="map-display"></canvas>

        <div class="character-detail-container">
                <canvas class="character-detail"></canvas>
        </div>

        <div class="controls-container">
                <button class="connect-button">Zu Spiel verbinden</button>
                <button class="initiate-game-button">Spielbrett initiieren</button>
                <button class="add-character-button">Charakter hinzufügen</button>
        </div>

        <div class="actions-container">
                <button class="fight-button">Kämpfen</button>
                <button class="draw-card-button">Schicksalskarte ziehen</button>
        </div>


</body>
</html>
